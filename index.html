<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보물찾기 경품 레이스</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#f4f2ff;--fg:#1e1b2e;--card:#ffffff;--ac:#6c4cff;--ac2:#ff4d8d;--gold:#ffb800;
  --mut:#6e6a85;--bd:#dcd6f7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151226;--fg:#f2f0ff;--card:#231e3d;--mut:#a59fc4;--bd:#3d3566;
  }
}
:root[data-theme="dark"]{
  --bg:#151226;--fg:#f2f0ff;--card:#231e3d;--mut:#a59fc4;--bd:#3d3566;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(155deg,#ffe29f 0%,#ffa99f 48%,#a1c4fd 100%) fixed;
  color:var(--fg);
  font:15px/1.5 -apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  padding:10px 12px 28px;
  min-height:100vh;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body{
    background:linear-gradient(155deg,#1e1338 0%,#152244 55%,#0f172a 100%) fixed;
  }
}
.wrap{max-width:980px;margin:0 auto}
.hdr{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:8px;margin:4px 0 12px;padding:10px 16px;
  background:linear-gradient(135deg,#6c4cff,#a855f7,#ff4d8d);
  border-radius:20px;box-shadow:0 8px 20px rgba(108,76,255,.32);
  border:3px solid rgba(255,255,255,.65);
}
.ttl{
  margin:0;font-size:clamp(20px,4vw,28px);font-weight:900;color:#fff;
  text-shadow:0 3px 0 #3b1d99,0 6px 12px rgba(0,0,0,.35);
  display:flex;align-items:center;gap:8px;letter-spacing:-.5px;
}
.hdr-sub{
  font-size:12px;font-weight:700;color:#ffe66b;background:rgba(0,0,0,.25);
  padding:4px 10px;border-radius:999px;
}
.card{
  background:var(--card);border:3px solid var(--ac);border-radius:18px;
  padding:14px;margin:10px 0;box-shadow:0 5px 0 rgba(0,0,0,.12);
}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.b{
  border:3px solid var(--ac);background:var(--card);color:var(--ac);
  border-radius:14px;padding:8px 13px;font:inherit;font-weight:800;
  cursor:pointer;box-shadow:0 4px 0 var(--ac);transition:transform .08s,filter .15s;
  user-select:none;
}
.b:hover{filter:brightness(1.04)}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ac)}
.b.on{background:linear-gradient(180deg,#8f76ff,#6c4cff);color:#fff}
.b.go{
  background:linear-gradient(180deg,#ffb347,#ff5e62);
  border-color:#c93d3d;box-shadow:0 4px 0 #c93d3d;color:#fff;
}
.b.gold{
  background:linear-gradient(180deg,#ffe066,#ff9f1c);
  border-color:#b86b00;box-shadow:0 4px 0 #b86b00;color:#2b1700;
}
.b.sm{padding:5px 10px;font-size:13px;border-radius:10px;box-shadow:0 2px 0 var(--ac)}
.b small{display:block;font-weight:600;font-size:11px;opacity:.92;margin-top:2px}
input,textarea,select{
  font:inherit;border:2px solid var(--bd);border-radius:10px;padding:7px 9px;
  background:var(--bg);color:var(--fg);max-width:100%;
}
input[type=number]{width:70px;font-weight:800;text-align:center}
textarea{width:100%;height:90px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:center}
th{font-weight:800;color:var(--ac)}
img.t{width:48px;height:48px;object-fit:cover;border-radius:10px;border:2px solid var(--bd)}
.mut{color:var(--mut);font-size:13px}

/* Bundle Registration Box */
.bundle-row{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  background:var(--bg);border:2px solid var(--bd);border-radius:14px;
  padding:8px 10px;margin:8px 0;
}
.bundle-Quick{
  background:rgba(108,76,255,.07);border:2px dashed var(--ac);
  border-radius:14px;padding:10px 12px;margin:8px 0;
}
.qty-badge{
  display:inline-block;background:var(--ac);color:#fff;font-size:11px;
  font-weight:900;padding:2px 8px;border-radius:99px;
}

/* Tier buttons & showcase */
.tier-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:8px;
}
.tier-btn{
  position:relative;overflow:hidden;border-radius:16px;padding:12px 10px;
  text-align:center;cursor:pointer;border:3px solid rgba(0,0,0,.18);
  font-weight:900;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.22);
  transition:transform .1s;
}
.tier-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tier-btn .t-badge{font-size:22px;display:block;margin-bottom:2px}
.tier-btn .t-title{font-size:16px;display:block;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.tier-btn .t-sub{
  font-size:11px;font-weight:700;background:rgba(0,0,0,.25);
  padding:2px 8px;border-radius:99px;display:inline-block;margin-top:4px;
}
.tb-1{background:linear-gradient(135deg,#ff9900,#ff5500,#ffd700);border-color:#994d00}
.tb-2{background:linear-gradient(135deg,#8b5cf6,#ec4899,#06b6d4);border-color:#5b21b6}
.tb-3{background:linear-gradient(135deg,#f59e0b,#ef4444);border-color:#991b1b}
.tb-4{background:linear-gradient(135deg,#10b981,#059669);border-color:#065f46}
.tb-5{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:#1e40af}
.tb-6{background:linear-gradient(135deg,#ec4899,#f43f5e);border-color:#9d174d}

/* Prize showcase grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.it{
  text-align:center;font-size:12px;font-weight:700;position:relative;
  background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:7px;
  transition:transform .15s;
}
.it:hover{transform:translateY(-2px)}
.it img,.it .svg-thumb{
  width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
  display:flex;align-items:center;justify-content:center;margin-bottom:4px;
  background:linear-gradient(135deg,rgba(108,76,255,.1),rgba(255,77,141,.1));
}
.it .it-num{
  position:absolute;top:4px;left:4px;background:var(--ac);color:#fff;
  font-size:10px;font-weight:900;padding:1px 7px;border-radius:99px;
}
.sold{opacity:.42;filter:grayscale(.6)}
.sold:after{
  content:'당첨완료';position:absolute;top:36%;left:6px;right:6px;
  font-weight:900;font-size:15px;color:#fff;background:#e11d48;
  border-radius:8px;padding:2px 0;transform:rotate(-8deg);
  box-shadow:0 3px 8px rgba(0,0,0,.35);
}


/* Roulette Fullscreen Overlay */
#rl{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#2b1f6b,#0b0820 70%);display:none;flex-direction:column;align-items:center;justify-content:flex-start;z-index:9;color:#fff;text-align:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow:hidden}
#rl-t{font-weight:900;font-size:clamp(16px,3.4vw,24px);text-shadow:0 2px 8px #000;margin-top:4px}
#rl-p{font-weight:800;font-size:clamp(13px,2.6vw,17px);color:#ffe66b;margin:4px 0 6px}
#rl-wrap{position:relative;flex:none}
#rl-wheel{display:block;border-radius:50%;box-shadow:0 0 0 6px #ffe66b,0 0 0 11px #6c4cff,0 10px 40px #000a;will-change:transform}
#rl-ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid #ff4d8d;filter:drop-shadow(0 3px 4px #000a);z-index:2}
#rl-hub{position:absolute;left:50%;top:50%;width:16%;height:16%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe66b 55%,#d49a00);box-shadow:0 3px 10px #000a;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,4vw,26px);z-index:1}
#rl-name{margin-top:16px;min-height:1.3em;font-weight:900;font-size:clamp(26px,7vw,48px);color:#fff;text-shadow:0 3px 0 #6c4cff,0 6px 18px #000}
#rl-name.win{color:#ffe66b;transform:scale(1.12);transition:transform .25s}
#rl-win{margin-top:6px;font-weight:800;font-size:clamp(12px,2.6vw,16px);color:#ffd3e0;max-width:94vw;line-height:1.5}
#rl-skip{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3}

/* Race Fullscreen Overlay */
#rc{position:fixed;inset:0;background:#0b0820;display:none;flex-direction:column;z-index:9}
#cv{flex:1;width:100%;min-height:0;display:block}
#rt{
  position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;
  text-align:center;color:#fff;font-weight:900;font-size:clamp(16px,3vw,22px);
  text-shadow:0 2px 8px #000;pointer-events:none;z-index:2;
}
#hud{
  position:absolute;top:calc(38px + env(safe-area-inset-top,0px));left:50%;
  transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(20,14,48,.88),rgba(88,28,135,.9),rgba(20,14,48,.88));
  border:2px solid #ffe66b;border-radius:999px;padding:5px 18px;
  color:#ffe66b;font-weight:900;font-size:clamp(13px,2.5vw,16px);
  text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.5);z-index:2;
  white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;
}
#rankbd{
  position:absolute;top:calc(80px + env(safe-area-inset-top,0px));left:12px;
  background:rgba(15,12,35,.82);border:2px solid rgba(255,255,255,.25);
  border-radius:14px;padding:8px 10px;color:#fff;font-size:12px;
  min-width:155px;max-width:210px;z-index:2;backdrop-filter:blur(4px);
  pointer-events:none;
}
.rk-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 0;font-weight:700}
.rk-win{color:#ffe66b}
.rk-cut{border-top:1px dashed #ff4d8d;margin-top:3px;padding-top:3px;font-size:10px;color:#ff8da1;text-align:center}
#rc-prog{
  position:absolute;top:calc(80px + env(safe-area-inset-top,0px));right:12px;
  background:rgba(15,12,35,.82);border:2px solid rgba(255,255,255,.25);
  border-radius:14px;padding:8px 12px;color:#fff;font-size:12px;font-weight:800;
  z-index:2;text-align:right;pointer-events:none;
}
#rc-ctrls{
  position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;
  display:flex;gap:8px;flex-wrap:wrap;z-index:3;
}
#skip{
  position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:14px;
  z-index:3;
}
#cd{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-size:clamp(72px,18vw,130px);font-weight:900;color:#fff;
  text-shadow:0 6px 0 #6c4cff,0 12px 28px #000;pointer-events:none;z-index:4;
}
#cd.pop{animation:pop .5s}

/* Picker Modal */
#pk{
  position:fixed;inset:0;background:rgba(10,8,24,.76);display:none;
  align-items:center;justify-content:center;z-index:8;padding:14px;backdrop-filter:blur(4px);
}
#pk .card{max-height:92vh;overflow:auto;width:100%;max-width:520px}
.names{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:6px;margin:10px 0;max-height:34vh;overflow:auto;padding:4px;
}
.nm{
  padding:7px 8px;border:2px solid var(--bd);border-radius:10px;
  cursor:pointer;font-weight:700;display:flex;align-items:center;gap:5px;
  background:var(--bg);transition:border-color .12s,background .12s;
}
.nm:has(input:checked){border-color:var(--ac);background:rgba(108,76,255,.14)}

/* Result / Prize Reveal Modal (#rs) */
#rs{
  position:fixed;inset:0;background:rgba(8,6,20,.86);display:none;
  align-items:center;justify-content:center;z-index:10;padding:14px;
  backdrop-filter:blur(6px);
}
.rs-box{
  position:relative;max-height:90vh;overflow:auto;width:100%;max-width:560px;
  border-radius:24px;padding:18px 16px;text-align:center;
  box-shadow:0 16px 50px rgba(0,0,0,.6);border:4px solid #ffd700;
  animation:pop .45s cubic-bezier(.18,.89,.32,1.28);
}
.rs-theme-1{background:linear-gradient(160deg,#2b1500 0%,#5c2d00 45%,#1f1035 100%);color:#fff;border-color:#ffd700}
.rs-theme-2{background:linear-gradient(160deg,#1c103b 0%,#3b1d6e 50%,#0f2942 100%);color:#fff;border-color:#00e5ff}
.rs-theme-3{background:linear-gradient(160deg,#331208 0%,#591c0b 50%,#2b1222 100%);color:#fff;border-color:#ff9900}
.rs-theme-4{background:linear-gradient(160deg,#082e22 0%,#0d4a38 50%,#112233 100%);color:#fff;border-color:#34d399}
.rs-theme-5{background:linear-gradient(160deg,#0c1e3e 0%,#17356e 50%,#1b1538 100%);color:#fff;border-color:#60a5fa}
.rs-theme-6{background:linear-gradient(160deg,#380d24 0%,#59153a 50%,#241233 100%);color:#fff;border-color:#f472b6}

.rs-badge{
  display:inline-block;padding:5px 16px;border-radius:999px;font-weight:900;
  font-size:13px;letter-spacing:.5px;margin-bottom:6px;
  background:linear-gradient(90deg,#ffd700,#ff8c00,#ffd700);color:#2b1200;
  box-shadow:0 3px 12px rgba(255,215,0,.45);
}
.rs-title{
  margin:4px 0 4px;font-size:clamp(22px,4.5vw,30px);font-weight:900;
  color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.5);
}
.rs-sub{margin:0 0 12px;font-size:13px;color:#ffe699;font-weight:700}
.rs-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.res{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 12px;
  background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);
  border-radius:18px;position:relative;overflow:hidden;
  animation:cardReveal .55s cubic-bezier(.18,.89,.32,1.28) both;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.res-spotlight{
  width:118px;height:118px;border-radius:18px;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#fff 0%,#ffe8a3 70%,#ffb703 100%);
  border:3px solid #ffd700;box-shadow:0 0 22px rgba(255,215,0,.55);
  overflow:hidden;
}
.res-spotlight img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.res-stamp{
  position:absolute;top:8px;right:8px;background:#ff2a5f;color:#fff;
  font-size:10px;font-weight:900;padding:2px 7px;border-radius:99px;
  transform:rotate(8deg);box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.res-winner{
  font-size:21px;font-weight:900;color:#ffe66b;
  text-shadow:0 2px 4px rgba(0,0,0,.5);
}
.res-prize-box{
  width:100%;background:rgba(0,0,0,.38);border:1px solid rgba(255,215,0,.45);
  border-radius:12px;padding:7px 10px;
}
.res-tier-tag{
  font-size:11px;font-weight:900;color:#ffd700;display:block;
}
.res-prize-name{
  font-size:15px;font-weight:900;color:#fff;display:block;margin-top:2px;
}

/* Treasure Chest Pre-Reveal Animation */
.chest-stage{
  padding:28px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.chest-anim{
  width:130px;height:130px;cursor:pointer;
  animation:chestShake .45s infinite alternate ease-in-out;
  filter:drop-shadow(0 0 25px rgba(255,215,0,.75));
}
@keyframes chestShake{
  0%{transform:rotate(-7deg) scale(1)}
  50%{transform:rotate(7deg) scale(1.08)}
  100%{transform:rotate(-5deg) scale(1.04)}
}
@keyframes pop{
  0%{transform:scale(.3);opacity:0}
  70%{transform:scale(1.06)}
  100%{transform:scale(1);opacity:1}
}
@keyframes cardReveal{
  0%{transform:translateY(24px) scale(.8) rotateY(40deg);opacity:0}
  75%{transform:translateY(-4px) scale(1.04) rotateY(0deg);opacity:1}
  100%{transform:translateY(0) scale(1) rotateY(0deg);opacity:1}
}

#cf{position:fixed;inset:0;pointer-events:none;z-index:11;display:none}
#dmsg{
  position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;
  z-index:12;display:none;background:#1e1b2e;color:#ffe66b;border:2px solid #ffe66b;
  border-radius:14px;padding:10px 14px;text-align:center;font-weight:900;
  box-shadow:0 8px 20px rgba(0,0,0,.45);animation:pop .4s;
}

/* Custom In-Page Dialog & Toast (replaces blocked alert/confirm) */
#dlg-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;
  align-items:center;justify-content:center;z-index:20;padding:16px;backdrop-filter:blur(3px);
}
#dlg-box{
  background:var(--card);color:var(--fg);border:3px solid var(--ac);
  border-radius:20px;padding:18px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 12px 32px rgba(0,0,0,.4);animation:pop .25s;
}
#dlg-txt{font-weight:800;font-size:15px;white-space:pre-line;margin:8px 0 16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="ttl">🏁 보물찾기 경품 대레이스 🎁</div>
    <div class="row">
      <span class="hdr-sub" id="snd-btn" onclick="toggleSnd()" style="cursor:pointer">🔊 효과음 켜짐</span>
      <span class="hdr-sub" id="cam-preset-lbl">🎮 3D 장애물·아이템 레이스</span>
    </div>
  </div>
  <div class="row" id="tabs"></div>
  <div id="main"></div>
</div>

<!-- 3D Race Screen -->
<div id="rc">
  <div id="rt"></div>
  <div id="hud"></div>
  <div id="rankbd"></div>
  <div id="rc-prog"></div>
  <div id="cd"></div>
  <canvas id="cv"></canvas>
  <div id="rc-ctrls">
    <button class="b gold" onclick="cheerBoost()">👏 응원 파워! (부스터)</button>
    <button class="b on" id="cam-btn" onclick="cycleCam()">🎥 시점: 선두 추적</button>
  </div>
  <button class="b go" id="skip">결과 바로 보기 ⏩</button>
</div>

<!-- Roulette Screen -->
<div id="rl">
  <div id="rl-t"></div>
  <div id="rl-p"></div>
  <div id="rl-wrap">
    <div id="rl-ptr"></div>
    <canvas id="rl-wheel"></canvas>
    <div id="rl-hub">🎁</div>
  </div>
  <div id="rl-name"></div>
  <div id="rl-win"></div>
  <button class="b go" id="rl-skip">결과 바로 보기 ⏩</button>
</div>

<canvas id="cf"></canvas>
<div id="dmsg"></div>
<div id="pk"></div>
<div id="rs"></div>

<!-- In-page Modal Dialog -->
<div id="dlg-ov">
  <div id="dlg-box">
    <div id="dlg-txt"></div>
    <div class="row" style="justify-content:center" id="dlg-btns"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),e=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt()+';');
const TT=[0,17,6,10,6,8,20],SES=['2:30','3:30','4:30','5:30'],NM=['','1등','2등','3등','4등','5등','6등'],T6=[1,2,3,4,5,6];

const TIER_META={

/* Custom Modal & Toast (Canvas safe replacement for alert/confirm) */
function msg(txt){
  const ov=$('dlg-ov'),t=$('dlg-txt'),b=$('dlg-btns');
  t.textContent=txt;
  b.innerHTML='<button class="b go" onclick="$(\'dlg-ov\').style.display=\'none\'">확인</button>';
  ov.style.display='flex';
  snd(520,.1,'triangle',.06);
}
function ask(txt,onYes){
  const ov=$('dlg-ov'),t=$('dlg-txt'),b=$('dlg-btns');
  t.textContent=txt;
  b.innerHTML='<button class="b go" id="dlg-yes">네, 진행할게요!</button><button class="b" onclick="$(\'dlg-ov\').style.display=\'none\'">취소</button>';
  ov.style.display='flex';
  $('dlg-yes').onclick=()=>{ov.style.display='none';onYes()};
}

const DB={
  open(){return new Promise((ok,no)=>{const r=indexedDB.open('trdb',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async get(){const d=await this.open();return new Promise(ok=>{const q=d.transaction('k').objectStore('k').get('S');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})},
  async set(v){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,'S');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
};

/* =====================================================================
   1등 · 2등 묶음(그룹) 일괄 관리 로직

function getBundles(t){
  const list=[];
  const map=new Map();
  S.items[t].forEach((it,idx)=>{
    const key=it.n;
    if(!map.has(key)){
      const b={n:it.n,img:it.img||'',total:0,got:0,indices:[]};
      map.set(key,b);
      list.push(b);
    }
    const b=map.get(key);
    if(!b.img&&it.img)b.img=it.img;
    b.total++;
    if(it.got)b.got++;
    b.indices.push(idx);
  });
  return list;
}

function setBundles(t,bundles){
  const next=[];
  bundles.forEach(b=>{
    const cnt=Math.max(b.got||0,Math.max(1,+b.total||1));
    const gotCnt=b.got||0;
    for(let i=0;i<cnt;i++){
      next.push({n:b.n||(NM[t]+' 상품'),img:b.img||'',got:i<gotCnt});
    }
  });
  S.items[t]=next;
  save();draw();
}

function updBundleName(t,bi,newName){
  const bs=getBundles(t);
  if(!bs[bi])return;
  bs[bi].n=newName.trim()||(NM[t]+' 상품');
  setBundles(t,bs);
}

function updBundleQty(t,bi,newQty){
  const bs=getBundles(t);
  if(!bs[bi])return;
  const minQ=Math.max(1,bs[bi].got);
  bs[bi].total=Math.max(minQ,newQty||minQ);
  setBundles(t,bs);
}

function addBundle(t){
  const bs=getBundles(t);
  let idx=bs.length+1;
  let newName=`${NM[t]} 상품 ${idx}`;
  while(bs.some(b=>b.n===newName)){idx++;newName=`${NM[t]} 상품 ${idx}`}
  bs.push({n:newName,img:'',total:1,got:0});
  setBundles(t,bs);
}

function delBundle(t,bi){
  const bs=getBundles(t);
  if(!bs[bi])return;
  if(bs[bi].got>0)return msg('이미 당첨자가 나온 묶음은 삭제할 수 없어요.\n수량만 남은 개수 이하로 줄일 수 있습니다.');
  if(bs.length<=1)return msg('최소 1개의 상품 묶음은 있어야 해요!');
  bs.splice(bi,1);
  setBundles(t,bs);
}

function mergeSingleBundle(t){
  if(test)return msg('테스트를 끄고 설정해 주세요');
  const total=S.items[t].length||TT[t];
  const gotCnt=S.items[t].filter(x=>x.got).length;
  const firstImg=(S.items[t].find(x=>x.img)||{}).img||'';
  setBundles(t,[{n:`${NM[t]} 상품`,img:firstImg,total,got:gotCnt}]);
  msg(`📦 ${NM[t]} 상품 전체(${total}개)를 하나로 묶었어요!\n이제 대표 사진 1장과 이름만 넣으면 ${total}개 전체에 한 번에 적용됩니다.`);
}

function bulkTextApply(t){
  const el=$('bulk-txt-'+t);
  if(!el||!el.value.trim())return msg('묶음으로 등록할 상품 이름을 입력해 주세요!\n예: 드론 5, 레고 6, 보드게임 6\n또는: 드론, 레고, 보드게임');
  const raw=el.value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
  if(!raw.length)return;

  const targetTotal=S.items[t].length||TT[t];
  const parsed=raw.map(s=>{
    const m=s.match(/^(.*?)(?:\s*[*xX×:]\s*|\s+)(\d+)\s*개?$/);
    if(m&&m[1].trim())return {n:m[1].trim(),q:+m[2]};
    return {n:s.replace(/\s*개$/,'').trim(),q:0};
  });

  // Auto-distribute remaining quantity if user didn't specify numbers
  const fixedSum=parsed.reduce((a,b)=>a+b.q,0);
  const zeroItems=parsed.filter(p=>p.q<=0);
  if(zeroItems.length){
    const remain=Math.max(zeroItems.length,targetTotal-fixedSum);
    const base=Math.floor(remain/zeroItems.length);
    let extra=remain%zeroItems.length;
    zeroItems.forEach(p=>{p.q=base+(extra-->0?1:0)});
  }

  const oldBundles=getBundles(t);
  const newBundles=parsed.map((p,i)=>({
    n:p.n,
    img:(oldBundles[i]&&oldBundles[i].img)||'',
    total:Math.max(1,p.q),
    got:0
  }));
  setBundles(t,newBundles);
  msg(`✨ ${NM[t]} 상품을 ${newBundles.length}개 묶음(총 ${newBundles.reduce((a,b)=>a+b.total,0)}개)으로 한 번에 등록했어요!`);
}

function resizeFileToDataUrl(file){
  return new Promise(ok=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const c=document.createElement('canvas'),k=Math.min(1,360/Math.max(im.width,im.height));
        c.width=im.width*k;c.height=im.height*k;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        ok(c.toDataURL('image/jpeg',.72));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

async function picMultiBundles(files,t){

  if(test)return msg('사진 등록은 테스트를 끄고 해 주세요');
  const urls=[];
  for(const f of Array.from(files)){

  const bs=getBundles(t);
  if(urls.length===1&&bs.length===1){

    setBundles(t,bs);
    return msg(`📸 ${NM[t]} 묶음 전체(${bs[0].total}개)에 사진이 적용되었어요!`);

  // If multiple photos selected, match existing bundles or split total quantity across uploaded photos
  const total=S.items[t].length||TT[t];
  if(bs.length===urls.length){
    bs.forEach((b,i)=>b.img=urls[i]);

    return msg(`📸 선택한 사진 ${urls.length}장을 각 묶음에 한 번에 등록했어요!`);
  }
  const base=Math.max(1,Math.floor(total/urls.length));
  let extra=Math.max(0,total-base*urls.length);
  const newBundles=urls.map((u,i)=>({
    n:(bs[i]&&bs[i].n&&bs[i].n!==`${NM[t]} 상품`)?bs[i].n:`${NM[t]} 상품 ${i+1}`,
    img:u,
    total:base+(extra-->0?1:0),
    got:0

  msg(`📸 사진 ${urls.length}장을 한 번에 묶어 ${NM[t]} 상품(총 ${newBundles.reduce((a,b)=>a+b.total,0)}개)으로 등록했어요!`);
}

/* Rich Web Audio Synthesizer for Game & Tier Fanfares */
let ac=null,dn=null;
const snd=(f,d=.12,tp='square',v=.06,t0=0)=>{
  if(!soundOn)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=tp;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(ac.destination);
    const t=ac.currentTime+t0;
    o.start(t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.stop(t+d);
  }catch(x){}
};

/* Enhanced Fireworks + Confetti */
let cfAnim=null;
function confetti(tier=1){
  const c=$('cf');c.style.display='block';c.width=innerWidth;c.height=innerHeight;
  const x=c.getContext('2d');
  const count=tier===1?200:tier===2?160:120;
  const P=Array.from({length:count},(_,i)=>({
    x:i<40?c.width/2:Math.random()*c.width,
    y:i<40?c.height*.45:-20-Math.random()*c.height*.6,
    vx:i<40?(Math.random()-.5)*14:Math.random()*3-1.5,
    vy:i<40?(Math.random()-.8)*14:2.5+Math.random()*4.5,
    g:i<40?.28:0,
    r:5+Math.random()*6,
    a:Math.random()*6.28,
    va:(Math.random()-.5)*.2,
    c:tier===1&&i%3===0?'#ffd700':`hsl(${Math.random()*360},95%,62%)`
  }));
  if(cfAnim)cancelAnimationFrame(cfAnim);
  let n=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      x.save();x.translate(p.x,p.y);x.rotate(p.a);
      x.fillStyle=p.c;
      x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      x.restore();
    });
    if(++n<240)cfAnim=requestAnimationFrame(f);
    else c.style.display='none';
  })();
}

/* ===== 사진 릴(필름) 뽑기: 사진이 촤라락 돌다가 당첨 사진에서 멈춰요 ===== */
function reelVis(t,it,i){return it.img?`<img src="${it.img}">`:prizeArt(t,it.n,i)}
function reelRun(win,cb){
  if(dn||!win.length)return cb();
  const H=Math.min(260,Math.round(innerWidth*.62));
  let k=0,stop=false,raf=0;
  const next=()=>{
    cancelAnimationFrame(raf);
    if(k>=win.length)return cb();
    const w=win[k],t=w.tier,items=S.items[t],tgt=items[w.item];
    const pool=[];const seen=new Set();
    items.forEach((it,i)=>{const key=it.img||it.n;if(!seen.has(key)){seen.add(key);pool.push({v:reelVis(t,it,i),n:it.n})}});
    const fin={v:reelVis(t,tgt,w.item),n:tgt.n};
    const N=46,strip=[];
    let last=-1;
    for(let i=0;i<N;i++){let j;do{j=Math.floor(Math.random()*pool.length)}while(pool.length>1&&j===last);last=j;strip.push(pool[j])}
    strip.push(fin);
    const meta=TIER_META[t];
    $('rs').innerHTML=`<div class="rs-box rs-theme-${t}" style="text-align:center">
      <div class="rs-badge">${meta.icon} ${NM[t]} 경품 뽑기 (${k+1}/${win.length})</div>
      <h3 class="rs-title">🎰 ${e(w.name)} 님의 경품은?</h3>
      <div id="reel" style="position:relative;width:${H}px;max-width:100%;height:${H}px;margin:10px auto;overflow:hidden;border-radius:14px;background:#111;border:4px solid ${meta.col};padding:0 18px;box-sizing:content-box">
        <div style="position:absolute;left:0;top:0;bottom:0;width:18px;background:repeating-linear-gradient(#111 0 12px,#e8e8e8 12px 24px);opacity:.85"></div>
        <div style="position:absolute;right:0;top:0;bottom:0;width:18px;background:repeating-linear-gradient(#111 0 12px,#e8e8e8 12px 24px);opacity:.85"></div>
        <div id="rstrip" style="will-change:transform">${strip.map(x=>`<div style="width:${H}px;height:${H}px;display:flex;align-items:center;justify-content:center;overflow:hidden"><div style="width:${H}px;height:${H}px;overflow:hidden;filter:blur(0)">${x.v}</div></div>`).join('')}</div>
        <div style="position:absolute;left:0;right:0;top:0;height:30%;background:linear-gradient(#000a,transparent);pointer-events:none"></div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(transparent,#000a);pointer-events:none"></div>
      </div>
      <div id="rname" class="res-prize-name" style="min-height:30px;font-weight:900;font-size:20px">🎞 ...</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="b" id="rskip">⏩ 바로 멈추기</button></div>
    </div>`;
    $('rs').style.display='flex';
    const st=$('rstrip'),total=(strip.length-1)*H,T=4600,t0=performance.now();
    let lastIdx=-1,done=false;
    const ease=x=>1-Math.pow(1-x,3.4);
    const land=()=>{
      if(done)return;done=true;cancelAnimationFrame(raf);
      st.style.transform=`translateY(${-total}px)`;st.style.filter='';
      $('rname').textContent='🎁 '+fin.n;
      try{fan(t<3?t:3);confetti(t)}catch(x){}
      setTimeout(()=>{k++;next()},1700);
    };
    $('rskip').onclick=()=>{$('rskip').onclick=null;land()};
    const loop=now=>{
      if(done)return;
      const x=Math.min(1,(now-t0)/T),pos=total*ease(x),idx=Math.floor(pos/H);
      st.style.transform=`translateY(${-pos}px)`;
      st.style.filter=x<.75?`blur(${Math.min(3,(1-x)*4)}px)`:'';
      if(idx!==lastIdx){lastIdx=idx;snd(300+Math.min(700,idx*14),.04,'square',.04)}
      if(x>=1)land();else raf=requestAnimationFrame(loop);
    };
    drumroll();
    raf=requestAnimationFrame(loop);
  };
  next();
}

function goPk(){

  $('pk').style.display='none';pk=null;
  if(t>2){
    snap(NM[t]+' 보물 '+ppl.join(', ').slice(0,20));
    ppl.forEach(p=>give(p,t,-1,s));

  }
  const its=S.items[t].map((x,i)=>i).filter(i=>!S.items[t][i].got);
  // If all remaining prizes in this tier have the exact same name (1 single bundle), no need to race identical prizes unless user wants race excitement; still run the fun race so kids enjoy watching!
  // 구슬에는 경주하는 친구 이름이 적혀요. 도착하면 경품은 사진 릴로 랜덤 결정!
  run(ppl.map(x=>({label:x,key:x})),n,ppl.join(', ').slice(0,26)+' · '+NM[t]+' 경품 레이스!',w=>{
    snap(NM[t]+' 경품 레이스 '+w.map(m=>m.key).join(', ').slice(0,20));

    const res=pickIt.map((it,j)=>{give(names[j],t,it,s);return{name:names[j],tier:t,item:it}});
    save();draw();
    reelRun(res,()=>show(res,false));
  });
}

/* =====================================================================
   미당첨 룰렛 (runRoulette) — 한 명씩 돌려서 k명 추첨, 뽑힌 사람은 판에서 빠짐
   ===================================================================== */
function runRoulette(ms,k,title,cb){
  const ov=$('rl'),cv=$('rl-wheel'),ctx=cv.getContext('2d');
  const need=Math.min(k,ms.length);
  let pool=ms.slice(),won=[],raf=0,done=false,spinning=false,rot=0;
  ov.style.display='flex';
  $('rl-t').textContent=title;
  $('rl-name').textContent='';$('rl-name').className='';
  $('rl-win').textContent='';
  const S0=Math.round(Math.min(innerWidth*.84,innerHeight*.52,520));
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=cv.style.height=S0+'px';
  cv.width=cv.height=Math.round(S0*dpr);
  $('rl-wrap').style.width=$('rl-wrap').style.height=S0+'px';
  $('rl-wrap').style.margin='18px 0 0';

  const draw=()=>{
    const N=pool.length,R=cv.width/2,a=2*Math.PI/N;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
    ctx.translate(R,R);
    for(let i=0;i<N;i++){
      const s=-Math.PI/2+i*a;
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R-2,s,s+a);ctx.closePath();
      ctx.fillStyle='hsl('+((i*137.508)%360)+',72%,'+(i%2?56:62)+'%)';ctx.fill();
      if(N<=60){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=Math.max(1,R/260);ctx.stroke()}
      if(N<=40){
        ctx.save();ctx.rotate(s+a/2);ctx.textAlign='right';ctx.textBaseline='middle';
        const fs=Math.max(9*dpr,Math.min(R*.1,R*Math.PI*1.5/N*.62));
        ctx.font='900 '+fs+'px sans-serif';ctx.fillStyle='#1b1240';
        ctx.fillText(pool[i].label.slice(0,6),R*.92,0);ctx.restore();
      }
    }
  };
  const idxAt=th=>{const N=pool.length;const ang=(((-th)%360)+360)%360;return Math.min(N-1,Math.floor(ang/360*N))};
  const updWin=()=>{$('rl-win').textContent=won.length?'🏆 '+won.map((m,i)=>(i+1)+'. '+m.label).join('   '):''};

  const finish=()=>{
    if(done)return;done=true;cancelAnimationFrame(raf);
    ov.style.display='none';$('rl-skip').onclick=null;
    cb(won.slice());
  };
  // 바로 결과: 남은 인원을 즉시 무작위로 채움
  $('rl-skip').onclick=()=>{
    if(done)return;cancelAnimationFrame(raf);
    while(won.length<need&&pool.length){const j=Math.floor(Math.random()*pool.length);won.push(pool.splice(j,1)[0])}
    finish();
  };

  const T=dn?1800:(need<=3?5400:need<=8?3800:2600);
  const nextSpin=()=>{
    if(done)return;
    if(won.length>=need||!pool.length)return finish();
    draw();
    $('rl-p').textContent='🎯 '+(won.length+1)+' / '+need+'번째 추첨 · 남은 후보 '+pool.length+'명';
    $('rl-name').textContent='';$('rl-name').className='';
    const N=pool.length,a=360/N;
    const w=Math.floor(Math.random()*N);               // 당첨자: 균등 무작위
    const f=.12+Math.random()*.76;                     // 칸 안에서 멈출 위치
    const cur=((rot%360)+360)%360;
    const delta=((-(w+f)*a-cur)%360+360)%360;
    const total=360*(5+Math.floor(Math.random()*3))+delta;
    const t0=performance.now(),start=rot;let last=-1;spinning=true;
    cv.style.transform='rotate('+rot+'deg)';
    try{drumroll()}catch(x){}
    const ease=x=>1-Math.pow(1-x,3.6);
    const loop=now=>{
      if(done)return;
      const x=Math.min(1,(now-t0)/T);
      rot=start+total*ease(x);
      cv.style.transform='rotate('+rot+'deg)';
      const i=idxAt(rot);
      if(i!==last){last=i;$('rl-name').textContent=pool[i].label;snd(380+(i%12)*40,.035,'square',.035)}
      if(x<1){raf=requestAnimationFrame(loop);return}
      spinning=false;
      const m=pool.splice(w,1)[0];won.push(m);
      $('rl-name').textContent='🎉 '+m.label+' 🎉';$('rl-name').className='win';
      updWin();
      try{fan(3);confetti(1)}catch(x){}
      setTimeout(()=>{
        if(done)return;
        rot=((rot%360)+360)%360;cv.style.transform='rotate('+rot+'deg)';
        nextSpin();
      },won.length>=need?1800:1500);
    };
    raf=requestAnimationFrame(loop);
  };
  setTimeout(nextSpin,350);
}

function startU(t,auto,bunOnly){
  const B=S.bun||[];
  const ok=allNames().filter(n=>best(n)>t&&(bunOnly?B.includes(n):!B.includes(n)));
  if(!rem(t))return msg(NM[t]+' 남은 상품이 없어요');
  if(!ok.length)return msg('참여할 수 있는 사람이 없어요');
  const k=Math.min(rem(t),ok.length);
  const launch=()=>{
    runRoulette(ok.map(n=>({label:n,key:n})),k,'🎡 '+(bunOnly?'번외 ':'')+NM[t]+' 미당첨 역전 룰렛! (당첨 '+k+'명)',w=>{
      snap((bunOnly?'번외 ':'')+NM[t]+' 미당첨 룰렛');
      w.forEach(m=>{const o=S.log.find(l=>l.name==m.key&&!l.ret&&l.tier==best(m.key));if(o)giveBack(o)});
      const its=t<3?shuf(S.items[t].map((x,i)=>i).filter(i=>!S.items[t][i].got)):[];
      const res=w.map((m,j)=>{const it=t<3?its[j]:-1;give(m.key,t,it,-1);return{name:m.key,tier:t,item:it}});
      save();draw();reelRun(res.filter(r=>r.item>=0),()=>show(res,false));
    });
  };
  if(auto)launch();
  else ask(`${bunOnly?'번외 ':''}${NM[t]} 미당첨 룰렛을 시작할까요?\n\n• 참가 대상: ${ok.length}명\n• 당첨 인원: ${k}명`,launch);
}

let umsg='';
async function loadTxt(f){
  if(!f)return;
  const b=await f.arrayBuffer();
  let t;
  try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}
  catch(x){t=new TextDecoder('euc-kr').decode(b)}
  const seen=new Set(allNames()),add=[];
  let all=0,dup=0;
  t.replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(n=>{
    all++;if(seen.has(n))dup++;else{seen.add(n);add.push(n)}
  });
  S.roster.push(...add);save();
  umsg='파일 '+all+'명 중 같은 이름 '+dup+'명은 빼고 '+add.length+'명을 넣었어요.';
  draw();
}

function norm(){
  if(!S.cap)S.cap=JSON.parse(JSON.stringify(CAP_DEF));if(!S.capV){S.capV=2;if(S.cap[0]&&S.cap[0][3]==2)S.cap[0][3]=3}if(!S.capF)S.capF=[{},{},{},{}];

  for(let s=0;s<4;s++){if(!S.q[s]||!T6.some(t=>+S.q[s][t]>0)){const nothing=!S.log.some(l=>l.ses==s);if(nothing)S.q[s]=Object.assign({},S.cap[s])}}
  if(JSON.stringify(S.cap)===CAP_OLD)S.cap=JSON.parse(JSON.stringify(CAP_DEF));
  S.timg=S.timg||{};S.roster=S.roster||[];S.fr=S.fr||[];S.bun=S.bun||[];
  // 기본 경품 사진 자동 적용 (아직 손대지 않은 등수만)
  [1,2].forEach(t=>{
    const a=S.items&&S.items[t];
    if(a&&PRELOAD['b'+t].length&&a.every(x=>!x.img&&!x.got&&(x.n===`${t}등 상품`||new RegExp(`^${t}등 상품 \\d+$`).test(x.n)))) S.items[t]=preItems(t);
  });
  [3,4,5,6].forEach(t=>{if(!S.timg[t]&&PRELOAD.timg[t])S.timg[t]=PRELOAD.timg[t]});
  if(S.un){
    S.un.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!S.roster.includes(n))S.roster.push(n)});
    delete S.un;
  }
  // Automatically unify untouched default numbered items ('1등 상품 1..17', '2등 상품 1..6') into 1 clean bundle per tier
  [1,2].forEach(t=>{
    if(S.items&&S.items[t]&&S.items[t].length){
      const allDefault=S.items[t].every(x=>new RegExp(`^${t}등 상품 \\d+$`).test(x.n)&&!x.img&&!x.got);
      if(allDefault){
        S.items[t].forEach(x=>{x.n=`${t}등 상품`});
      }
    }
  });
}

/* ===== 캡슐 현황 · 보충 계산 ===== */
function capCalc(){
  // 못 찾은 캡슐은 현장에 그대로 남아 있으니, 다음 부 숨길 개수 = 다음 부 배정 − 남아 있는 개수
  const r=[];
  for(let s=0;s<4;s++){
    const done=s<S.ses||T6.some(t=>used(s,t)>0||(S.capF[s][t]!==undefined&&S.capF[s][t]!==null));
    r[s]={done,filled:!!(S.capFill&&S.capFill[s])};
    T6.forEach(t=>{
      const base=+S.cap[s][t]||0;
      const fl=S.capFill&&S.capFill[s];
      let prev,hide,avail;
      if(fl){prev=fl[t].prev;hide=fl[t].hide;avail=prev+hide}
      else{prev=(s>0&&r[s-1].done)?r[s-1][t].left:0;avail=Math.max(base,prev);hide=avail-prev}
      const ov=S.capF[s][t];
      const auto=ov===undefined||ov===''||ov===null;
      const found=done?(auto?used(s,t):+ov):0;
      r[s][t]={base,prev,hide,found,left:done?Math.max(0,avail-found):0,miss:done?Math.max(0,base-found):0,auto};
    });
  }
  return r;
}
function capDone(s,on){
  if(!S.capFill)S.capFill={};
  if(on){const r=capCalc();const o={};T6.forEach(t=>{o[t]={prev:r[s][t].prev,hide:r[s][t].hide}});S.capFill[s]=o;msg('✅ '+SES[s]+'부 캡슐 채우기 완료!\n숨긴 개수가 저장됐고, 이제부터 찾은 만큼 현장 남음이 줄어들어요.')}
  else delete S.capFill[s];
  save();draw();
}
function capLbl(t){return `${CAP_COL[t][0]} ${CAP_COL[t][1]}(${NM[t]})`}
function capTxt(s,r){
  return `⏰ ${SES[s]}부 숨길 캡슐\n`+T6.map(t=>`${capLbl(t)} ${r[s][t].hide}개`).join('\n')+`\n합계 ${T6.reduce((n,t)=>n+r[s][t].hide,0)}개`;
}
function capAll(r){
  const o=[];
  let nx=0;while(nx<3&&r[nx].filled)nx++;
  o.push(capTxt(nx,r));
  return o.join('\n\n');
}
function capCopy(txt){
  const done=()=>msg('📋 복사했어요!\n카카오톡에 붙여넣기 하세요.');
  const fb=()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(x){msg('복사가 안 돼요. 아래 글상자 내용을 길게 눌러 직접 복사해 주세요.')}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb();
}
let capSel=-1;
function vCap(){
  const r=capCalc();
  window.__cr=r;
  let h=`<div class="card mut">💡 <b>캡슐 보충 계산:</b> 못 찾은 캡슐은 현장에 남아 있으니, <b>다음 부 숨길 개수 = 다음 부 배정 − 남아 있는 개수</b>로 계산해요. '찾음'은 ①에서 당첨 처리한 수가 자동으로 들어가고, 직접 숫자를 넣으면 그 값이 우선돼요(비우면 자동).</div>`;
  h+=`<div class="card"><b>🧮 부별 기본 캡슐 수 (두루마리 색)</b><div style="overflow:auto"><table><tr><th>색깔·등수<th>${SES.map(x=>x+'부').join('<th>')}<th>합계 / 상품</tr>`+
    T6.map(t=>`<tr><td><b>${capLbl(t)}</b>`+[0,1,2,3].map(s=>`<td><input type="number" min="0" style="width:58px" value="${S.cap[s][t]}" onchange="S.cap[${s}][${t}]=+this.value;S.q[${s}][${t}]=+this.value;save();draw()">`).join('')+
    `<td>${[0,1,2,3].reduce((a,s)=>a+(+S.cap[s][t]||0),0)} / ${totCnt(t)}개</tr>`).join('')+`</table></div></div>`;
  for(let s=0;s<4;s++){
    const tot=T6.reduce((a,t)=>a+r[s][t].hide,0),fd=r[s].filled;
    h+=`<div class="card" ${fd?'style="border-color:#16a34a"':''}><div class="row" style="justify-content:space-between"><b>⏰ ${SES[s]}부 · ${fd?'✅ 숨긴 캡슐':'숨길 캡슐'} ${tot}개</b>
      <span class="row"><button class="b sm gold" onclick="capCopy(capTxt(${s},window.__cr))">📋 복사</button>
      ${fd?`<button class="b sm" onclick="capDone(${s},false)">↩ 완료 취소</button>`:`<button class="b sm go" onclick="capDone(${s},true)">✅ 채우기 완료</button>`}</span></div>
      <div style="overflow:auto"><table><tr><th>색깔·등수<th>배정<th>앞 부 남음<th>숨길 개수<th>찾음<th>못 찾음(남음)</tr>`+
      T6.map(t=>{const c=r[s][t];return `<tr><td><b>${capLbl(t)}</b><td>${c.base}개<td>${s>0&&r[s-1].done?c.prev+'개':'-'}<td><b style="color:#e11d48">${c.hide}개</b><td><input type="number" min="0" style="width:58px" placeholder="${used(s,t)}" value="${c.auto?'':c.found}" onchange="S.capF[${s}][${t}]=this.value===''?undefined:+this.value;save();draw()"><td>${!r[s].done?'-':c.left+'개'}</tr>`}).join('')+
      `</table></div></div>`;
  }
  const all=capAll(r);
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><b>💬 카카오톡용 전체 현황</b><button class="b go" onclick="capCopy(document.getElementById('cap-all').value)">📋 전체 복사</button></div>
    <textarea id="cap-all" readonly style="width:100%;height:260px;margin-top:8px">${e(all)}</textarea></div>`;
  return h;
}

  return h;
}

function cycleCam(){
  camMode=(camMode+1)%4;
  const names=['🎥 시점: 선두 추적','🎥 시점: 당첨 커트라인','🎥 시점: 박진감 근접','🎥 시점: 코스 전체'];
  const b=$('cam-btn');if(b)b.textContent=names[camMode];
  snd(600,.08,'sine',.05);
}

function setCaster(txt,dur=1800){
  const now=performance.now();
  if(now<casterLock)return;
  casterMsg=txt;
  casterLock=now+dur;
}

function cheerBoost(){
  if(!activeMarbles.length)return;
  snd(587,.1,'triangle',.08,0);
  snd(880,.18,'triangle',.1,.08);
  const pool=activeMarbles.filter(m=>!m.f);
  if(!pool.length)return;
  shuf(pool).slice(0,Math.max(2,Math.ceil(pool.length*.4))).forEach(m=>{
    m.vz+=4.5;
    m.vy=Math.max(m.vy,4.2);
    m.boostTimer=1.2;
  });
  setCaster('👏 응원 파워 발동!! 구슬들이 일제히 점프하며 가속합니다!! 🚀',1600);
}

function makeLabelCanvas(text,sub='',gold=false){
  const c=document.createElement('canvas');c.width=320;c.height=84;
  const g=c.getContext('2d');
  g.fillStyle=gold?'rgba(255,195,0,0.92)':'rgba(20,16,44,0.82)';
  g.strokeStyle=gold?'#fff':'#ffe66b';
  g.lineWidth=4;
  const r=18;
  g.beginPath();
  g.moveTo(14+r,10);g.lineTo(306-r,10);g.quadraticCurveTo(306,10,306,10+r);
  g.lineTo(306,72-r);g.quadraticCurveTo(306,72,306-r,72);
  g.lineTo(14+r,72);g.quadraticCurveTo(14,72,14,72-r);
  g.lineTo(14,10+r);g.quadraticCurveTo(14,10,14+r,10);
  g.closePath();
  g.fill();g.stroke();

  g.font='900 30px -apple-system,sans-serif';
  g.textAlign='center';
  g.fillStyle=gold?'#221000':'#ffffff';
  const shortTxt=text.length>11?text.slice(0,11)+'…':text;
  g.fillText(shortTxt,160,sub?43:51);
  if(sub){
    g.font='800 18px -apple-system,sans-serif';
    g.fillStyle=gold?'#7a2e00':'#ffe66b';
    g.fillText(sub,160,65);
  }
  return c;
}

function run(ms,k,title,cb){
  $('rc').style.display='flex';
  $('rt').textContent=title;
  camMode=0;
  if($('cam-btn'))$('cam-btn').textContent='🎥 시점: 선두 추적';

  const cv=$('cv'),W=7.5,L=96;
  const w=cv.clientWidth||innerWidth,h=cv.clientHeight||innerHeight;
  rd=rd||new THREE.WebGLRenderer({canvas:cv,antialias:true});
  rd.setSize(w,h,false);

  const sc=new THREE.Scene();
  sc.background=new THREE.Color(0x130f2e);
  sc.fog=new THREE.FogExp2(0x130f2e,0.0065);

  sc.add(new THREE.HemisphereLight(0xffffff,0x443388,1.05));
  const dl=new THREE.DirectionalLight(0xfff4d6,.85);
  dl.position.set(12,28,-15);
  sc.add(dl);

  const cam=new THREE.PerspectiveCamera(62,w/h,.1,240);

  // Track floor with colorful speed lanes
  const floorTexCanvas=document.createElement('canvas');
  floorTexCanvas.width=256;floorTexCanvas.height=256;
  const fg=floorTexCanvas.getContext('2d');
  fg.fillStyle='#2a2159';fg.fillRect(0,0,256,256);
  fg.fillStyle='#362b70';fg.fillRect(0,0,128,128);fg.fillRect(128,128,128,128);
  fg.strokeStyle='rgba(255,230,107,0.22)';fg.lineWidth=4;
  fg.strokeRect(0,0,256,256);
  const floorTex=new THREE.CanvasTexture(floorTexCanvas);
  floorTex.wrapS=THREE.RepeatWrapping;floorTex.wrapT=THREE.RepeatWrapping;
  floorTex.repeat.set(4,24);

  const floorMesh=new THREE.Mesh(
    new THREE.BoxGeometry(2*W,1,L+110),
    new THREE.MeshLambertMaterial({map:floorTex})
  );
  floorMesh.position.set(0,-.5,L/2-35);
  sc.add(floorMesh);

  // Glowing side rails
  const bx=(a,b,c,x,y,z,col)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),new THREE.MeshLambertMaterial({color:col}));
    m.position.set(x,y,z);sc.add(m);return m;
  };
  bx(.65,1.4,L+110,-W-.32,.2,L/2-35,0xff4d8d);
  bx(.65,1.4,L+110,W+.32,.2,L/2-35,0x00e5ff);

  [25,50,75].forEach(zPos=>{
    bx(2*W,.03,.4,0,.02,zPos,0x6c4cff);
  });

  // Checkerboard Finish Line & Golden Gate Arch
  bx(2*W,.06,1.8,0,.03,L,0xffffff);
  bx(1.1,7,1.1,-W+.4,3.5,L,0xffd700);
  bx(1.1,7,1.1,W-.4,3.5,L,0xffd700);
  bx(2*W+1.6,1.2,1.2,0,7.2,L,0xff4d8d);

  {
    const c=document.createElement('canvas');c.width=512;c.height=128;
    const g=c.getContext('2d');
    g.fillStyle='rgba(0,0,0,0.55)';g.fillRect(16,12,480,104);
    g.font='900 72px sans-serif';g.textAlign='center';
    g.strokeStyle='#ff2a5f';g.lineWidth=10;
    g.strokeText('🏁 FINISH 🏁',256,88);
    g.fillStyle='#ffe66b';
    g.fillText('🏁 FINISH 🏁',256,88);
    const f=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));
    f.scale.set(13,3.2,1);f.position.set(0,5.2,L);sc.add(f);
  }

  // 1. Bouncy Pinball Bumpers (P)
  const P=[];
  const bumperCols=[0xff3366,0xffbe0b,0x00f5d4,0x8338ec];
  for(let z=9;z<L-7;z+=4.8){
    for(let j=0;j<3;j++){
      const p={x:(Math.random()*2-1)*(W-1.2),z:z+Math.random()*2.4,r:.58};
      const col=bumperCols[(z+j)%bumperCols.length];
      const cyl=new THREE.Mesh(
        new THREE.CylinderGeometry(.55,.55,1.2,18),
        new THREE.MeshLambertMaterial({color:col})
      );
      cyl.position.set(p.x,.15,p.z);
      const ring=new THREE.Mesh(
        new THREE.TorusGeometry(.62,.1,10,20),
        new THREE.MeshBasicMaterial({color:0xffffff})
      );
      ring.rotation.x=Math.PI/2;ring.position.y=.4;
      cyl.add(ring);
      sc.add(cyl);
      p.mesh=cyl;
      P.push(p);
    }
  }

  // 2. Spinning Windmill Hammers (spinners)
  const spinners=[];
  [18,38,58,78].forEach((zPos,idx)=>{
    const grp=new THREE.Group();
    grp.position.set((idx%2===0?-2.2:2.2),.55,zPos);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.4,16),new THREE.MeshLambertMaterial({color:0xffd700}));
    const bar=new THREE.Mesh(new THREE.BoxGeometry(5.6,.55,.45),new THREE.MeshLambertMaterial({color:0xff2a5f}));
    grp.add(hub);grp.add(bar);
    sc.add(grp);
    spinners.push({grp,x:grp.position.x,z:zPos,len:2.8,dir:idx%2===0?1:-1,angle:Math.random()*3});
  });

  // 3. Speed Boost Pads & Jump Ramps (boostPads)
  const boostPads=[];
  [14,30,46,64,82].forEach((zPos,idx)=>{
    const xPos=((idx*2.7)%1-.5)*(W*1.2);
    const isJump=idx%2===1;
    const pad=new THREE.Mesh(
      new THREE.BoxGeometry(2.2,.12,2.6),
      new THREE.MeshBasicMaterial({color:isJump?0xff9f1c:0x00f5d4})
    );
    pad.position.set(xPos,.06,zPos);
    if(isJump)pad.rotation.x=-0.18;
    sc.add(pad);
    boostPads.push({x:xPos,z:zPos,isJump});
  });

  // 4. Floating Mystery Item Boxes (itemBoxes)
  const itemBoxes=[];
  [22,42,62,74].forEach(zPos=>{
    for(let k2=-1;k2<=1;k2+=2){
      const xPos=k2*(2.2+Math.random()*1.8);
      const box=new THREE.Mesh(
        new THREE.BoxGeometry(.85,.85,.85),
        new THREE.MeshLambertMaterial({color:0xffd700,emissive:0x553300})
      );
      box.position.set(xPos,.75,zPos);
      sc.add(box);
      itemBoxes.push({mesh:box,x:xPos,z:zPos,cooldown:0});
    }
  });

  // Build Marbles (M)
  const M=ms.map((m,i)=>{
    const col=new THREE.Color().setHSL((i*.618)%1,.88,.56);
    const o={
      ...m,
      x:(i%8-3.5)*1.55,
      y:.48,
      z:-Math.floor(i/8)*1.3,
      vx:0,vy:0,vz:0,
      sp:.92+Math.random()*.22,
      boostTimer:0,
      col,
      f:0,
      finishRank:0
    };
    o.mesh=new THREE.Mesh(
      new THREE.SphereGeometry(.48,22,16),
      new THREE.MeshPhongMaterial({color:col,shininess:90})
    );
    const halo=new THREE.Mesh(
      new THREE.TorusGeometry(.56,.07,8,20),
      new THREE.MeshBasicMaterial({color:0xffffff})
    );
    halo.rotation.x=Math.PI/2;
    o.mesh.add(halo);
    o.halo=halo;

    const c=makeLabelCanvas(m.label,'',false);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
    sp.scale.set(4.2,1.1,1);
    sp.position.y=1.25;
    o.mesh.add(sp);
    o.spMat=sp.material;
    sc.add(o.mesh);
    return o;
  });

  activeMarbles=M;
  const order=[],need=Math.min(k,M.length);
  raceNeed=need;
  let stop=false,end=0,go=false,last=performance.now(),lastLeader='',frameCount=0;
  casterLock=0;
  setCaster('🎙️ 잠시 후 경품 대레이스가 출발합니다! 👏 응원 파워 버튼으로 응원해 주세요!',2500);

  function triggerItemEffect(m){
    const roll=Math.random();
    if(roll<.42){
      m.vz+=10.5;m.boostTimer=1.8;
      snd(880,.18,'sawtooth',.07);
      setCaster(`🚀 대박 아이템! [${m.label}] 슈퍼 로켓 부스터 발동!!`,1500);
    }else if(roll<.72){
      m.vy=7.5;m.vz+=7.5;m.boostTimer=1.5;
      snd(1047,.2,'triangle',.08);
      setCaster(`🌟 [${m.label}] 슈퍼 스타 점프! 장애물을 훌쩍 뛰어넘습니다!`,1500);
    }else{
      m.vz+=8.5;
      m.x*=.5;
      snd(740,.15,'sine',.07);
      setCaster(`🧲 [${m.label}] 황금 자석 아이템 획득! 결승선을 향해 질주!`,1500);
    }
  }

  function step(dt){
    for(const s of spinners){
      s.angle+=s.dir*2.8*dt;
      s.grp.rotation.y=s.angle;
    }
    for(const ib of itemBoxes){
      ib.mesh.rotation.y+=2.5*dt;
      ib.mesh.rotation.x+=1.5*dt;
      if(ib.cooldown>0){
        ib.cooldown-=dt;
        ib.mesh.visible=ib.cooldown<=0;
      }
    }

    let maxZ=0;
    for(const m of M)if(!m.f&&m.z>maxZ)maxZ=m.z;

    for(const m of M){
      if(m.f)continue;
      if(m.boostTimer>0){
        m.boostTimer-=dt;
        m.halo.material.color.setHex(0xffe66b);
      }else{
        m.halo.material.color.setHex(0xffffff);
      }

      const catchup=Math.min(0.35,Math.max(0,(maxZ-m.z)*0.012));
      const boostMul=m.boostTimer>0?1.45:1;
      m.vz+=6.4*(m.sp+catchup)*boostMul*dt;
      m.vx+=(Math.random()-.5)*8.5*dt;
      m.vx*=1-.42*dt;
      m.vz*=1-.5*dt;

      if(m.y>.48||m.vy>0){
        m.vy-=17*dt;
        m.y+=m.vy*dt;
        if(m.y<=.48){m.y=.48;m.vy=0}
      }

      m.x+=m.vx*dt;
      m.z+=m.vz*dt;

      for(const bp of boostPads){
        if(Math.abs(m.x-bp.x)<1.15&&Math.abs(m.z-bp.z)<1.25&&m.y<.8){
          if(bp.isJump&&m.vy<=0){
            m.vy=6.8;m.vz+=4.5;
            snd(620,.08,'sine',.04);
          }else if(!bp.isJump&&m.boostTimer<=.2){
            m.vz+=7.5;m.boostTimer=1.1;
            snd(780,.08,'triangle',.04);
            setCaster(`⚡ [${m.label}] 부스터 패드를 밟고 총알같이 튀어나갑니다!`,1200);
          }
        }
      }

      for(const ib of itemBoxes){
        if(ib.cooldown<=0&&Math.hypot(m.x-ib.x,m.z-ib.z)<1.05){
          ib.cooldown=3.5;
          ib.mesh.visible=false;
          triggerItemEffect(m);
        }
      }

      if(m.y<1.25){
        for(const s of spinners){
          const dx=m.x-s.x,dz=m.z-s.z,dist=Math.hypot(dx,dz);
          if(dist<s.len+.45){
            const bxDir=Math.cos(s.angle),bzDir=-Math.sin(s.angle);
            const proj=dx*bxDir+dz*bzDir;
            const perp=Math.abs(-dx*bzDir+dz*bxDir);
            if(Math.abs(proj)<s.len&&perp<.55){
              m.vx+=s.dir*9;
              m.vz=Math.max(-3,m.vz-4.5);
              m.vy=3.2;
              snd(220,.08,'square',.05);
              setCaster(`💥 앗! [${m.label}] 회전 풍차 장애물에 튕겼습니다!`,1100);
            }
          }
        }

        for(const p of P){
          const dx=m.x-p.x,dz=m.z-p.z,d=Math.hypot(dx,dz);
          if(d<1.02&&d>0){
            const nx=dx/d,nz=dz/d,v=m.vx*nx+m.vz*nz;
            m.x=p.x+nx*1.02;m.z=p.z+nz*1.02;
            if(v<0){
              m.vx-=1.75*v*nx;
              m.vz-=1.75*v*nz;
              snd(340+Math.random()*200,.05,'sine',.03);
            }
          }
        }
      }

      if(Math.abs(m.x)>W-.48){
        m.x=Math.sign(m.x)*(W-.48);
        m.vx*=-.7;
      }

      if(m.z>=L){
        m.f=1;
        order.push(m);
        m.finishRank=order.length;
        if(order.length<=need){
          snd(880+order.length*110,.18,'triangle',.09);
          setCaster(`🎊 골인!! [${m.label}] ${order.length}등으로 결승선 통과!! (당첨 확정!)`,1500);
        }
      }
    }

    for(let i=0;i<M.length;i++){
      for(let j=i+1;j<M.length;j++){
        const a=M[i],b=M[j];
        if(a.f||b.f||Math.abs(a.y-b.y)>.7)continue;
        const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
        if(d<.96&&d>0){
          const nx=dx/d,nz=dz/d,o=(.96-d)/2;
          a.x-=nx*o;a.z-=nz*o;b.x+=nx*o;b.z+=nz*o;
          const v=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;
          if(v<0){
            a.vx+=v*nx;a.vz+=v*nz;b.vx-=v*nx;b.vz-=v*nz;
          }
        }
      }
    }
  }

  function fin(){
    if(stop)return;
    stop=true;
    activeMarbles=[];
    $('cd').style.display='none';
    $('rc').style.display='none';
    cb(order.slice(0,need));
  }

  function loop(n){
    if(stop)return;
    const dt=Math.min(.05,(n-last)/1000);
    last=n;
    if(!end&&go){
      step(dt/2);step(dt/2);
      if(order.length>=need)end=n;
    }

    M.forEach(m=>m.mesh.position.set(m.x,m.y,m.z));

    const sorted=[...order,...M.filter(m=>!m.f).sort((a,b)=>b.z-a.z)];
    const ld=sorted[0]||M[0];
    const cutMarble=sorted[Math.min(need-1,sorted.length-1)]||ld;

    if(go&&ld.label!==lastLeader){
      lastLeader=ld.label;
      if(ld.z>12&&ld.z<L-5){
        setCaster(`🔥 역전 드라마! [${ld.label}] 선두로 치고 나갑니다!!`,1300);
      }
    }
    if(go&&L-ld.z<18&&L-ld.z>14){
      setCaster(`🚨 결승선 코앞!! 과연 행운의 주인공은 누가 될 것인가?!`,1500);
    }

    let targetZ=Math.min(ld.z,L);
    if(camMode===1)targetZ=Math.min(cutMarble.z,L);
    if(camMode===0){
      cam.position.set(0,10.5,targetZ-14.5);
      cam.lookAt(0,0,targetZ+8);
    }else if(camMode===1){
      cam.position.set(0,9.5,targetZ-13);
      cam.lookAt(0,0,targetZ+7);
    }else if(camMode===2){
      cam.position.set(ld.x*.5,5.2,targetZ-7.5);
      cam.lookAt(ld.x*.3,1,targetZ+9);
    }else{
      cam.position.set(0,26,L*.45-18);
      cam.lookAt(0,0,L*.55);
    }

    $('hud').textContent='선두: '+ld.label+'  |  '+(casterMsg||'🏁 전속력으로 결승선을 향해 달립니다!');

    if(++frameCount%6===0){
      const pct=Math.min(100,Math.max(0,Math.round(ld.z/L*100)));
      $('rc-prog').innerHTML=`🏁 진행률 <b>${pct}%</b><br><span style="color:#ffe66b">당첨 ${order.length} / ${need}명</span>`;
      const showCnt=Math.min(sorted.length,Math.max(need+2,5));
      let rkHtml=`<div style="font-weight:900;color:#ffe66b;margin-bottom:4px">🏆 실시간 순위 (당첨 ${need}명)</div>`;
      for(let i=0;i<showCnt&&i<8;i++){
        const m=sorted[i];
        const isWin=i<need;
        rkHtml+=`<div class="rk-row ${isWin?'rk-win':''}">
          <span>${isWin?'👑':'🏃'} ${i+1}위 ${e(m.label.slice(0,8))}</span>
          <span>${m.f?'골인!':Math.max(0,Math.round(m.z/L*100))+'%'}</span>
        </div>`;
        if(i===need-1&&i<sorted.length-1){
          rkHtml+=`<div class="rk-cut">▲ 당첨 커트라인 (${need}위) ▲</div>`;
        }
      }
      $('rankbd').innerHTML=rkHtml;
    }

    rd.render(sc,cam);
    if(end&&n-end>1600)return fin();
    requestAnimationFrame(loop);
  }

  [3,2,1,'출발! 🚀'].forEach((x,i)=>setTimeout(()=>{
    if(stop)return;
    const d=$('cd');d.textContent=x;d.style.display='flex';d.className='';
    void d.offsetWidth;d.className='pop';
    snd(i===3?880:440,.22,'square',.08);
  },i*750));

  setTimeout(()=>{go=true;if(!stop)$('cd').style.display='none'},3100);
  $('skip').onclick=()=>{while(order.length<need)step(.025);fin()};
  requestAnimationFrame(loop);
}

window.addEventListener('resize',()=>{
  if($('rc').style.display==='flex'&&rd){
    const cv=$('cv');
    rd.setSize(cv.clientWidth||innerWidth,cv.clientHeight||innerHeight,false);
  }
});

(async()=>{
  let d=null;
  try{d=await DB.get()}catch(x){}
  if(!d){try{d=JSON.parse(localStorage.getItem('tr1'))}catch(x){}}
  if(d)S=d;
  norm();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}
  draw();
})();
</script>
